[project]
name = "githire-backend"
version = "0.1.0"
description = "GitHire — AI-powered hiring and career platform (FastAPI modular monolith)"
requires-python = ">=3.12"
dependencies = [
    # API
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.5",
    "pydantic-settings==2.7.1",
    # Database
    "sqlalchemy[asyncio]==2.0.37",
    "asyncpg==0.30.0",
    "alembic==1.14.1",
    # Auth
    "pyjwt==2.10.1",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.20",
    # Cache / queue (Redis via Memurai)
    "redis==5.2.1",
    "celery[redis]==5.4.0",
    # Rate limiting
    "slowapi==0.1.9",
    # AI / GitHub adapters (final vendor choices made during feature work)
    "openai==1.59.7",
    "anthropic==0.42.0",
    "httpx==0.28.1",
    # AWS storage adapter
    "boto3==1.36.8",
    # Utilities
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "httpx==0.28.1",
    "ruff==0.9.2",
    "mypy==1.14.1",
    "types-passlib==1.7.7.20241221",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
